# pyproject.toml
[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
skip-string-normalization = true
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 79
known_first_party = ["app"]
src_paths = ["app"]

[tool.ruff]
# Enable pycodestyle (E), pyflakes (F), and additional rules
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "T20", # print debugging
]
ignore = [
    "E501", # line too long (handled by black)
    "E203", # whitespace before ':', conflicts with black
]

target-version = "py312"

[tool.ruff.isort]
known-first-party = ["app"]

[tool.ruff.mccabe]
# Tăng ngưỡng phức tạp cho service lớn (TT99 có logic phức tạp)
max-complexity = 12